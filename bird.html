*{box-sizing:border-box}html{background:#dce2d4}body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:radial-gradient(ellipse at 15% 12%,#f7f2e5 0,transparent 42%),radial-gradient(ellipse at 90% 70%,#c5d2bc 0,transparent 50%),#dce2d4;color:var(--ink);font-family:var(--font-body);font-weight:400}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #345346;outline-offset:5px}button:disabled{cursor:default}img{display:block;max-width:100%}[hidden]{display:none!important}.card{position:relative;width:min(100%,590px);height:min(860px,calc(100svh - 48px));min-height:620px;isolation:isolate;overflow:hidden;container-type:inline-size;box-shadow:0 20px 90px #52664b26,0 2px 6px #5a6b4a20;background:#bacdb7}.home{position:absolute;inset:0;overflow:hidden;transition:filter .6s,transform .7s}.tree{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tree-wash{position:absolute;inset:0;background:linear-gradient(180deg,#edf0cd17 0%,#6e9e8110 55%,#eef0da85 100%);pointer-events:none}.border-line{position:absolute;inset:13px;border:1px solid #f9fae976;pointer-events:none}.cover-meta{position:absolute;top:35px;left:34px;right:34px;display:flex;justify-content:space-between;gap:10px;font-size:10px;letter-spacing:.22em}.cover-meta span:last-child{font-family:var(--font-meta);font-size:11px;letter-spacing:.16em}.falling-title{position:absolute;top:11%;left:5%;width:90%;height:41%;margin:0;z-index:1;pointer-events:none;font-family:var(--font-display);font-weight:400}.falling-title span{position:absolute;left:var(--x);top:var(--y);font-size:var(--s);line-height:1;font-weight:400;color:rgb(48 85 62 / 56%);text-shadow:0 2px 25px #eef1d544;opacity:0;animation:letter-fall 1.65s cubic-bezier(.16,.7,.3,1) var(--d) forwards;transform:translateY(-110px) rotate(calc(var(--r) - 7deg))}.falling-title .light-letter{color:#f4f4dacf;text-shadow:0 1px 1px #284d4b28,0 5px 24px #799c8060}.falling-title .mountain-letter{color:#3d6b4d85}.birds{position:absolute;width:30%;right:9%;top:8.5%;opacity:.45;mix-blend-mode:multiply;animation:birds-drift 9s ease-in-out infinite;pointer-events:none}.branch{position:absolute;z-index:4;display:flex;align-items:center;min-height:50px;transform:translate(-17px,-50%);gap:9px;white-space:nowrap}.branch.reverse{flex-direction:row-reverse;transform:translate(calc(-100% + 17px),-50%)}.branch-dot{display:grid;place-items:center;width:34px;height:44px;position:relative;flex-shrink:0}.branch-dot:before{content:"";width:8px;height:8px;border-radius:50%;background:#fffbe9;box-shadow:0 0 0 5px #f5f3dc5e,0 0 22px 7px #f5fbe880;animation:glow 3.5s ease-in-out infinite}.branch-dot:after{content:"";width:27px;height:27px;border:1px solid #f7f9e9ba;position:absolute;transform:rotate(45deg);border-radius:2px}.branch-label{display:flex;flex-direction:column;gap:3px;text-shadow:0 1px 8px #f1f2d6,0 0 15px #f8f4df;transition:transform .25s}.branch-label small{font:9px var(--font-meta);letter-spacing:.13em}.branch-label strong{font:23px var(--font-display);letter-spacing:.20em}.branch:hover .branch-label{transform:translateY(-3px)}.branch-style .branch-dot:before{animation-delay:-1s}.branch-echo .branch-dot:before{animation-delay:-2s}.branch-notes .branch-dot:before{animation-delay:-.5s}.cover-whisper{position:absolute;top:60%;left:43%;display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.2em;writing-mode:vertical-rl;line-height:2;pointer-events:none;opacity:.85}.whisper-line{display:block;height:48px;width:1px;background:linear-gradient(var(--ink),transparent)}.cover-flower{position:absolute;bottom:2%;left:-9%;width:38%;opacity:.8;transform:rotate(17deg);pointer-events:none;filter:drop-shadow(0 5px 10px #62866b12);animation:flower-sway 7s ease-in-out infinite;transform-origin:40% 100%}.cover-ivy{position:absolute;width
