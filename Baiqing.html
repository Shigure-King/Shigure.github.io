  <style>
:root {
  color-scheme: light;
  --paper: #dee9f1;
  --settle: cubic-bezier(.35,.04,.2,1);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--paper); }
button { -webkit-tap-highlight-color: transparent; }

.stage {
  --clock-width: clamp(640px, 83vw, 1430px);
  --clock-x: 34%;
  --clock-y: 37%;
  --clock-end-x: 26%;
  --clock-end-y: 43%;
  --end-scale: .82;
  --pin-x: 50.1582%;
  --pin-y: 49.5007%;
  --frame: clamp(14px, 2.2vw, 37px);
  --image-position: 52% 47%;
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 310px;
  overflow: hidden;
  isolation: isolate;
  background: var(--paper);
}

.intro-shade, .landscape, .glass-fragment, .sky, .clock-layout, .fog,
.engraving, .grain, .lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.intro-shade {
  background:
    radial-gradient(ellipse at 41% 31%, #edf3f5 1%, #d0e0e9 32%, transparent 70%),
    radial-gradient(ellipse at 5% 89%, #8ea5b9 0%, transparent 44%),
    linear-gradient(145deg, #ccdbe5 14%, #b3c6d4 50%, #476985 97%);
}
.intro-shade::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(165deg, transparent 32%, #f5f5ef55 45%, transparent 57%),
    linear-gradient(159deg, transparent 51%, #dce9ef55 62%, transparent 73%);
  filter: blur(10px);
}

.landscape {
  object-fit: cover;
  object-position: var(--image-position);
  transform: scale(1.065);
  transform-origin: 55% 68%;
  opacity: 0;
  transition: opacity 3.3s .6s var(--settle), transform 6.3s .5s var(--settle);
}
[data-state="cover"] .landscape { opacity: 1; transform: scale(1); }

.glass-fragment {
  clip-path: polygon(0 100%,0 95%,12.4% 89.7%,19.2% 87.1%,22.4% 84.4%,28.9% 80.7%,31.8% 81.4%,36.4% 78.3%,44.3% 76.9%,50.1% 72%,54% 72.2%,58.5% 68.8%,64.7% 67.8%,72.1% 63.5%,77.4% 64.9%,84.1% 61.3%,91% 59.7%,100% 56%,100% 100%);
  opacity: 0;
  transition: opacity 2.6s 3.5s ease;
}
.glass-fragment::before {
  content: "";
  position: absolute;
  inset: -1.25%;
  background:
    linear-gradient(155deg, #d2e7f338 12%, transparent 54%, #153e5f33),
    url('https://audio.pagehost.icu/autoupload/e953j/20261119/Dlct/1264X1982/395f2da64ed3490d5491c85cb2f633d9.jpg/webp') var(--image-position)/cover;
  filter: saturate(.95) brightness(.96);
  transform: translate(-.7%,.8%);
}
[data-state="cover"] .glass-fragment { opacity: .84; }

.sky {
  background:
    radial-gradient(ellipse 56% 51% at 75% 19%, #f7f9f5c9 0%, #eef4f580 48%, transparent 90%),
    linear-gradient(to top, #163c5ad9 0%, #193b5915 10%, transparent 24%);
  opacity: 0;
  transition: opacity 3s .65s var(--settle);
}
[data-state="cover"] .sky { opacity: 1; }

.clock-layout { mix-blend-mode: multiply; opacity: .95; transition: opacity 4s var(--settle); }
[data-state="cover"] .clock-layout { opacity: .81; }
.clock-shell {
  position: absolute;
  top: var(--clock-y);
  left: var(--clock-x);
  width: var(--clock-width);
  aspect-ratio: 1264 / 701;
  transform-origin: var(--pin-x) var(--pin-y);
  transform: translate(calc(-1 * var(--pin-x)), calc(-1 * var(--pin-y)));
  transition: left 4.8s .28s var(--settle), top 4.8s .28s var(--settle), transform 4.8s .28s var(--settle);
}
[data-state="cover"] .clock-shell {
  left: var(--clock-end-x);
  top: var(--clock-end-y);
  transform: translate(calc(-1 * var(--pin-x)), calc(-1 * var(--pin-y))) scale(var(--end-scale));
}
.clock, .clock img, .bezel, .clock-hand-window {
  display: block;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.clock {
  --vignette: radial-gradient(ellipse 49% 47% at 50% 49%, black 35%, #000e 56%, #0007 76%, transparent 100%);
  -webkit-mask-image: var(--vignette);
  mask-image: var(--vignette);
}
.bezel { z-index: 1; opacity: .9; }
.clock-hand-window {
  clip-path: polygon(0 0,100% 0,100% 64%,66% 65%,62% 61%,58% 59%,55% 58%,52% 60%,49% 58%,46% 61%,41% 64%,36% 69%,0 69%);
}
.clock-hand { transform-origin: var(--pin-x) var(--pin-y); animation: clock-travel 150s linear infinite; }
[data-state="cover"] .clock-hand { animation-play-state: paused; }
.clock-hub { clip-path: ellipse(1.18% 2.57% at var(--pin-x) var(--pin-y)); }
@keyframes clock-travel { to {transform: rotate(1turn);} }

.fog { opacity: 1; transition: opacity 3.6s .15s var(--settle); }
[data-state="cover"] .fog { opacity: 0; }
.fog__back, .fog__front {
  position: absolute;
  inset: -11%;
  transition: transform 3.85s var(--settle);
}
.fog__back {
  background:
    radial-gradient(ellipse 31% 18% at 29% 25%,#f4f8f9c4, transparent),
    radial-gradient(ellipse 42% 22% at 30% 57%,#dfebf0a6,transparent);
}

.fog__back::before { background-size: 119% 77%; background-position: 50% 100%; opacity: .85; }
.fog__front::before { background-size: 91% 45%; background-position: 8% 49%; opacity: .83; animation-delay: -8s; }
@keyframes drift { from {transform: translate(-2%,1%);} to {transform: translate(2%,-1.6%);} }
[data-state="cover"] .fog__back { transform: translate(-22%,-12%) scale(1.08); }
[data-state="cover"] .fog__front { transform: translate(25%,12%) scale(1.18); }

.pin-echo {
  position: absolute;
  top: var(--clock-y); left: var(--clock-x);
  width: clamp(50px,9vw,155px); aspect-ratio: 1;
  border-radius: 50%; border: 1px solid #fbf5d2;
  opacity: 0; transform: translate(-50%,-50%) scale(.15);
  pointer-events: none;
}
[data-state="cover"] .pin-echo { animation: echo 1.95s ease-out both; }
@keyframes echo {
  12% {opacity: .86;}
  to {opacity: 0; transform: translate(-50%,-50%) scale(1.3);}
}

.engraving {
  opacity: .06;
  -webkit-mask-image: linear-gradient(90deg,transparent 5%,black 25% 80%,transparent);
  mask-image: linear-gradient(90deg,transparent 5%,black 25% 80%,transparent);
  transition: opacity 3.5s 2.2s ease-in-out;
}
[data-state="cover"] .engraving { opacity: 1; }

.lines { --line: #516f8899; --pale: #f2f4eee0; }
.corner {
  position: absolute; width: clamp(21px,3.8vw,61px); height: 11px;
  border: 1px solid var(--line);
}
.corner--top-left { top: max(var(--frame),env(safe-area-inset-top)); left: var(--frame); border-right: 0; border-bottom: 0; }
.corner--top-right { top: max(var(--frame),env(safe-area-inset-top)); right: var(--frame); border-left: 0; border-bottom: 0; }
.corner--bottom-left { bottom: max(var(--frame),env(safe-area-inset-bottom)); left: var(--frame); border-top: 0; border-right: 0; border-color: var(--pale); }
.corner--bottom-right { bottom: max(var(--frame),env(safe-area-inset-bottom)); right: var(--frame); border-top: 0; border-left: 0; border-color: var(--pale); }
.index-rule {
  position: absolute; top: var(--frame); left: 13%; width: 14%; height: 4px;
  background: repeating-linear-gradient(90deg,#547188a8 0 1px,transparent 1px 6px);
  mask-image: linear-gradient(90deg,black,transparent);
}
.margin-rule {
  position: absolute; right: var(--frame); top: calc(var(--frame) + 25px);
  height: 14%; width: 1px;
  background: linear-gradient(transparent,#688098a6);
}
.margin-rule::after {
  content: ""; position: absolute; left: -2px; bottom: -5px;
  width: 5px; height: 5px; transform: rotate(45deg); background: #a38756;
}

.time-trigger {
  position: absolute; left: var(--clock-x); top: var(--clock-y);
  transform: translate(-50%, -22px);
  display: grid; justify-items: center; grid-template-rows: 44px auto; gap: 15px;
  min-width: 136px; padding: 0 8px 8px;
  border: 0; background: none; color: #19354b; cursor: pointer;
  transition: opacity .85s ease;
}
[data-state="cover"] .time-trigger {
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .85s ease, visibility 0s .85s;
}
.trigger-light {
  position: relative; align-self: center; width: 8px; height: 8px;
  border-radius: 50%; background: #fffff5;
  box-shadow: 0 0 6px 2px #fffae4,0 0 17px 7px #f8f2cfbf;
}
.trigger-light::before, .trigger-light::after {
  content: ""; position: absolute; inset: -9px;
  border-radius: inherit; border: 1px solid #fff7ddee;
}
.trigger-light::after { inset: -15px; animation: breathe 4.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% {transform: scale(.78);opacity:.22;} 50% {transform:scale(1.15);opacity:.83;} }
.trigger-label {
  padding: 4px .95em 6px 1.25em; border-block: 1px solid #eaf2f277;
  font: normal 400 clamp(16px,1.35vw,20px)/1.5 "Mended Serif","Songti SC",SimSun,serif;
  letter-spacing: .3em;
  background: linear-gradient(90deg,transparent,#e2ecf1ed 24%,#e5eff4f2 75%,transparent);
}
button:focus-visible { outline: 1px solid #264f72; outline-offset: 5px; }

.cover-controls {
  position: absolute; z-index: 7;
  bottom: max(calc(var(--frame) + 3px),calc(env(safe-area-inset-bottom) + 7px));
  left: calc(var(--frame) + 12px); right: calc(var(--frame) + 12px);
  display: flex; align-items: center; gap: clamp(12px,2vw,28px);
  animation: controls-in 1.4s 2s both;
}
.cover-controls[hidden] { display: none; }
.cover-controls:focus-within { opacity: 1 !important; }
@keyframes controls-in { from {opacity:0;} to {opacity:1;} }
.cover-button {
  display: flex; gap: .7em; align-items: center;
  min-height: 44px; color: #f6f8f4; border: 0; padding: 3px 2px;
  cursor: pointer; background: none; text-shadow: 0 1px 3px #37546f;
  font: 400 clamp(12px,1.1vw,15px)/1.3 "Mended Serif","Songti SC",SimSun,serif;
  letter-spacing: .16em;
}
.cover-button:focus-visible {outline-color: #fff6df;}
.sound-line {
  flex: 1; height: 1px; position: relative;
  background: linear-gradient(90deg,#ebdaba95,#e6ebec40 42%,#e6ebec68);
}
.sound-line::before {
  content: ""; width: 4px; height: 4px; position: absolute; left: 0; top:-1.5px;
  background: #eee0bb; transform: rotate(45deg);
}
.music-icon { display: flex; align-items: center; height: 17px; gap: 2px; }
.music-icon i { width: 1px; height: 4px; background: currentColor; }
.music-icon[data-playing="true"] i { height: 14px; animation: sound-bars 1.22s alternate ease-in-out infinite; }
.music-icon[data-playing="true"] i:nth-child(2) { animation-delay:-.8s; }
.music-icon[data-playing="true"] i:nth-child(3) { animation-delay:-.45s; }
.music-icon[data-playing="true"] i:nth-child(4) { animation-delay:-.2s; }
@keyframes sound-bars {from {transform:scaleY(.25);} to {transform:scaleY(1);} }
.replay-icon {
  position: relative; width: 12px; height: 12px; border: 1px solid currentColor;
  border-left-color: transparent; border-radius: 50%; transform:rotate(-20deg);
}
.replay-icon::after {
  content:"";position:absolute;top:-1px;left:-1px;width:4px;height:4px;
  border-left:1px solid currentColor;border-bottom:1px solid currentColor;
}
.music-status {
  position: absolute; bottom: 100%; margin: 0; padding: .25em .6em;
  color: #fff; background: #354e64; font: 12px/1.5 system-ui,sans-serif;
}
.music-status:empty {display:none;}

@media (max-width: 720px) {
  .stage {
    --frame: 15px; --clock-width: max(485px,158vw);
    --clock-x: 42%; --clock-y: 34.5%;
    --clock-end-x: 23%; --clock-end-y: 44%;
    --end-scale: .8; --image-position: 49% 50%;
  }
  .sky {
    background:
      radial-gradient(ellipse 94% 32% at 81% 21%,#fcfaf3cf 0%,#f0f4f474 56%,transparent 98%),
      linear-gradient(to top,#163850db,transparent 13%);
  }
  [data-state="cover"] .clock-layout { opacity: .72; }
  .fog__back::before { background-position: 50% 88%; background-size: 163% 79%; }
  .fog__front::before { background-position: 56% 45%; background-size: 147% 40%; }
  .index-rule { left: 18%; width: 17%; }
}
@media (max-height: 520px) and (orientation: landscape) {
  .stage { --clock-width:max(460px,65vw); --clock-x:27%; --clock-y:40%; --clock-end-x:24%; --clock-end-y:46%; }
}
@media (prefers-reduced-motion: reduce) {
  .clock-hand, .trigger-light::after, .fog__back::before, .fog__front::before,
  [data-state="cover"] .pin-echo, .music-icon[data-playing="true"] i, .cover-controls {animation:none;}
  .landscape, .glass-fragment, .sky, .clock-shell, .clock-layout, .fog,
  .fog__back, .fog__front, .engraving, .time-trigger, [data-state="cover"] .time-trigger { transition:none; }
}

/* Return the scene and its touch target to the opening pose together. */
[data-state="intro"] :is(.landscape,.glass-fragment,.sky,.clock-shell,.clock-layout,.fog,.fog__back,.fog__front,.engraving) {
  transition: none;
}

.cover-watermark {
  position: absolute;
  z-index: 5;
  top: max(env(safe-area-inset-top), clamp(2px, .55vh, 7px));
  inset-inline: 0;
  text-align: center;
  color: #395b76;
  font: 400 14.85vw/.88 "Mended Lettering", "Times New Roman", serif;
  letter-spacing: -.058em;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(.095em);
  pointer-events: none;
  user-select: none;
}

[data-state="cover"] .cover-watermark {
  animation: cover-watermark-in 2.5s 1.2s cubic-bezier(.23,.59,.17,1) both;
}

@keyframes cover-watermark-in {
  to { opacity: .25; transform: translateY(0); }
}

.cover-title {
  --font-display: "Mended Serif", "Songti SC", SimSun, serif;
  --font-meta: "Mended Lettering", "Times New Roman", serif;
  --title-size: clamp(25px, 3.9vw, 59px);
  position: absolute;
  z-index: 6;
  top: 9%;
  right: 4%;
  width: min(56%, 45rem);
  height: clamp(20rem, 52%, 34rem);
  isolation: isolate;
  pointer-events: none;
}

.cover-title[hidden] {
  display: none;
}

.cover-title__text {
  margin: 0;
  position: absolute;
  inset: 0;
  z-index: 1;
  color: #18354e;
  font: 400 var(--title-size)/1.15 var(--font-display);
  letter-spacing: .018em;
  text-shadow: 0 0 .25em #edf7ffaf, 0 1px #f2faff84;
}

.cover-title__text:focus {
  outline: none;
}

<script>
const stage = document.querySelector('.stage');
const trigger = document.querySelector('#time-trigger');
const title = document.querySelector('.cover-title');
const controls = document.querySelector('.cover-controls');
const audio = document.querySelector('#bgm');
const musicToggle = document.querySelector('#music-toggle');
const musicIcon = document.querySelector('.music-icon');
const musicStatus = document.querySelector('#music-status');
const replay = document.querySelector('#replay');

const upperPane = document.querySelector('.upper-pane');
const lowerPane = document.querySelector('.lower-pane');
const innerPage = document.querySelector('.inner-page');
const seamEntry = document.querySelector('#seam-entry');
const backToCover = document.querySelector('#back-to-cover');
const backLabel = backToCover.querySelector('.back-label');
const innerViewport = innerPage.querySelector('.inner-viewport');
const innerPanels = innerPage.querySelectorAll('[data-panel]');
const directoryLinks = innerPage.querySelectorAll('[data-open]');

// Both clipped halves use the same artwork and animation clock. Text and controls
// live on the upper pane and the fixed footer, outside the copied art layer.
const lowerArt = document.querySelector('.cover-art').cloneNode(true);
lowerArt.querySelector('.engraving').removeAttribute('id');
lowerPane.append(lowerArt);

function updateMusicControl() {
  const playing = !audio.paused && !audio.ended && !audio.error;
  const label = `${playing ? '暂停' : '播放'}《时间煮雨》`;
  musicIcon.dataset.playing = String(playing);
  musicToggle.setAttribute('aria-label', label);
  musicToggle.title = label;
}

function playMusic() {
  musicStatus.textContent = '';
  if (audio.error) audio.load();
  audio.play().catch(error => {
    updateMusicControl();
    if (stage.dataset.state === 'cover' && error.name !== 'AbortError') {
      musicStatus.textContent = '音乐暂未播放';
    }
  });
}

trigger.addEventListener('click', () => {
  if (stage.dataset.state !== 'intro') return;
  stage.dataset.state = 'cover';
  title.hidden = false;
  controls.hidden = false;
  seamEntry.hidden = false;
  trigger.disabled = true;
  title.querySelector('h1').focus({ preventScroll: true });
  playMusic();
});

musicToggle.addEventListener('click', () => {
  if (audio.paused) {
    playMusic();
  } else {
    audio.pause();
  }
});

replay.addEventListener('click', () => {
  audio.pause();
  audio.currentTime = 2.342;
  musicStatus.textContent = '';
  for (const hand of stage.querySelectorAll('.clock-hand')) {
    hand.getAnimations().forEach(animation => { animation.currentTime = 0; });
  }
  seamEntry.hidden = true;
  title.hidden = true;
  controls.hidden = true;
  stage.dataset.state = 'intro';
  trigger.disabled = false;
  trigger.focus({ preventScroll: true });
});

for (const event of ['playing', 'pause', 'ended', 'error']) {
  audio.addEventListener(event, updateMusicControl);
}

function showInnerView(name) {
  innerPage.dataset.view = name;
  for (const panel of innerPanels) panel.hidden = panel.dataset.panel !== name;
  innerViewport.scrollTop = 0;
  backLabel.textContent = name === 'directory' ? '返回封面' : '返回目录';
}

for (const link of directoryLinks) {
  link.addEventListener('click', () => {
    if (stage.dataset.page !== 'inner') return;
    showInnerView(link.dataset.open);
    const panel = document.getElementById(link.getAttribute('aria-controls'));
    panel.querySelector('h2').focus({ preventScroll: true });
  });
}

async function turnPage(entering) {
  if (stage.dataset.state !== 'cover' || stage.dataset.page !== (entering ? 'cover' : 'inner')) return;
  if (entering) showInnerView('directory');
  innerPage.hidden = false;
  innerPage.inert = true;
  upperPane.inert = true;
  seamEntry.hidden = true;
  replay.hidden = true;
  backToCover.hidden = true;
  stage.dataset.page = entering ? 'opening' : 'closing';
  // getAnimations() flushes the new styles and also handles reduced motion.
  const motion = upperPane.getAnimations();
  await Promise.allSettled(motion.map(animation => animation.finished));
  stage.dataset.page = entering ? 'inner' : 'cover';
  innerPage.hidden = !entering;
  innerPage.inert = !entering;
  upperPane.inert = entering;
  backToCover.hidden = !entering;
  replay.hidden = entering;
  seamEntry.hidden = entering;
  if (entering) {
    document.querySelector('#inner-title').focus({ preventScroll: true });
  } else {
    seamEntry.focus({ preventScroll: true });
  }
}
seamEntry.addEventListener('click', () => { turnPage(true); });
function backFromInner() {
  if (stage.dataset.page !== 'inner') return;
  const current = innerPage.dataset.view;
  if (current === 'directory') {
    turnPage(false);
    return;
  }
  showInnerView('directory');
  innerPage.querySelector('[data-open="' + current + '"]').focus({ preventScroll: true });
}
backToCover.addEventListener('click', backFromInner);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') backFromInner();
});

const flowerStyle = document.querySelector('#inner-style');
flowerStyle.addEventListener('click', event => {
  const nextFlower = event.target.closest('.flower-point');
  if (!nextFlower) return;
  const currentFlower = flowerStyle.querySelector('.flower-point[aria-pressed="true"]');
  currentFlower?.setAttribute('aria-pressed', 'false');
  if (currentFlower !== nextFlower) nextFlower.setAttribute('aria-pressed', 'true');
});

(() => {
  const canvas = document.querySelector('#engraving');
  const ink = canvas?.getContext('2d');
  if (!ink) return;

  // These anchors meet the borders of the displaced image facets.
  const seam = [
    [.124, .897], [.192, .871], [.224, .844], [.289, .807], [.318, .814],

    [.647, .678], [.721, .635], [.774, .649], [.841, .613], [.910, .597],

  const chips = [
    [.165, .884], [.202, .857], [.266, .825], [.302, .812], [.347, .798],
    [.413, .777], [.475, .746], [.520, .719], [.565, .710], [.610, .684],
    [.682, .656], [.746, .645], [.809, .631], [.877, .608],

  const forks = [
    [.48, [seam[2], [.211, .828], [.222, .807], [.199, .790], [.201, .779], [.181, .762]]],
    [.25, [[.222, .807], [.239, .801], [.254, .782]]],
    [.54, [seam[5], [.352, .765], [.362, .750], [.342, .740], [.347, .724], [.333, .711]]],
    [.63, [seam[7], [.511, .739], [.543, .752], [.555, .768], [.589, .777]]],
    [.24, [[.543, .752], [.573, .745], [.594, .750]]],
    [.42, [seam[11], [.704, .621], [.709, .604], [.689, .587], [.697, .577], [.684, .558]]],
    [.32, [seam[13], [.840, .632], [.855, .640], [.860, .661], [.889, .674]]],
    [.43, [seam[14], [.936, .582], [.952, .582], [.980, .565]]],
    [.29, [seam[14], [.929, .599], [.949, .609], [.972, .604]]],
  ];

  // Each bridge has its own span and skew, like hand sewing.
  const stitches = [
    [3, .42, 13, .27], [4, .11, 18, -.20], [4, .68, 20, .18],
    [6, .06, 18, -.25], [6, .29, 21, .07], [6, .56, 23, -.18], [6, .83, 16, .12],
    [9, .28, 17, .24], [9, .58, 19, -.12], [9, .89, 15, .26],
    [10, .18, 13, .12],
  ];

  // Reuse the painted vertices for both pieces of glass and the touch band.
  const fracture = seam.flatMap((point, index) => chips[index] ? [point, chips[index]] : [point]);
  const edge = [[0, .95], ...fracture, [.936, .582], [.952, .582], [.980, .565], [1, .556]];
  const stage = document.querySelector('.stage');
  const edgeCSS = edge.map(([x,y]) => (x*100) + '% ' + (y*100) + '%').join(',');
  stage.style.setProperty('--upper-edge', 'polygon(0 0,' + edgeCSS + ',100% 0)');
  stage.style.setProperty('--lower-edge', 'polygon(0 100%,' + edgeCSS + ',100% 100%)');
  const band = edge.slice(1, -1);
  function touchPoints(points, offset) {
    return points.map(([x,y]) => ((x-.06)/.91*100) + '% calc(' + ((y-.53)/.40*100) + '% ' + offset + 'px)');
  }
  const touchOutline = [...touchPoints(band, '- 24'), ...touchPoints(band.slice().reverse(), '+ 24')];
  stage.style.setProperty('--crack-hit', 'polygon(' + touchOutline.join(',') + ')');
  const underCanvas = document.querySelector('.lower-pane .engraving');

  function trace(points, offsetX, offsetY, color, width) {
    ink.beginPath();
    ink.moveTo(points[0][0] + offsetX, points[0][1] + offsetY);
    for (const [x, y] of points.slice(1)) ink.lineTo(x + offsetX, y + offsetY);
    ink.strokeStyle = color;
    ink.lineWidth = width;
    ink.stroke();
  }

  function puncture(x, y, scale) {
    ink.beginPath();
    ink.ellipse(x, y + .22, 1.65 * scale, 1.20 * scale, -.42, 0, Math.PI * 2);
    ink.fillStyle = 'rgba(32, 42, 69, .78)';
    ink.fill();
    ink.strokeStyle = 'rgba(255, 240, 194, .58)';
    ink.lineWidth = .55;
    ink.stroke();
  }

  function stitch(a, b, along, length, skew, scale) {
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const magnitude = Math.hypot(dx, dy);
    const tx = dx / magnitude;
    const ty = dy / magnitude;
    const nx = -ty;
    const ny = tx;
    const x = a[0] + dx * along;
    const y = a[1] + dy * along;
    const half = length * scale / 2;

    canvas.height = Math.round(height * dpr);

    ink.lineJoin = 'round';

    const fracturePixels = fracture.map(toPixels);

    for (const [weight, path] of forks) {
      const branch = path.map(toPixels);
      trace(branch, -.22, -.36, 'rgba(38, 71, 110, .66)', 1.55 * weight * scale);
      trace(branch, .45, .70, 'rgba(235, 248, 255, .90)', 1.38 * weight * scale);
    }

    trace(fracturePixels, -.38, -.44, 'rgba(36, 69, 103, .64)', 1.75 * scale);
    trace(fracturePixels, .58, .85, 'rgba(231, 247, 255, .83)', 1.08 * scale);
    trace(fracturePixels, 0, 0, 'rgba(85, 127, 167, .77)', .65 * scale);
    for (const [index, along, length, skew] of stitches) {
      stitch(joins[index], joins[index + 1], along, length, skew, scale);

  } else {

  }
})();

(() => {
  const surface = document.querySelector('.water-surface');
  const water = surface?.getContext('2d');
  if (!water) return;

  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const stage = document.querySelector('.stage');
  const locations = {
    intro: [[.19, .77], [.78, .66], [.60, .88]],
    cover: [[.30, .89], [.82, .79], [.68, .91]],
    inner: [[.14, .82], [.89, .74], [.77, .92]],
  };

  let view = { width: 0, height: 0 };
  let frame = 0;
  let ambientTimer = 0;
  let locationIndex = 0;

  const active = () => !motion.matches && !document.hidden;

  function fitSurface() {
    const bounds = surface.getBoundingClientRect();
    if (!bounds.width || !bounds.height) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    view = bounds;
    surface.width = Math.round(view.width * dpr);
    surface.height = Math.round(view.height * dpr);
    water.setTransform(surface.width / view.width, 0, 0, surface.height / view.height, 0, 0);
    water.lineCap = 'round';

  function arc(x, y, rx, ry, tilt, start, end, color, weight, opacity) {
    water.beginPath();
    water.ellipse(x, y, rx, ry, tilt, start, end);

    water.lineWidth = weight;
    water.globalAlpha = opacity;
    water.stroke();

    if (originGlow > 0) {
      water.beginPath();
      water.ellipse(wave.x, wave.y, 2.4 + travel * .018, 1 + travel * .005, -.08, 0, Math.PI * 2);
      water.fillStyle = '#f9faff';
      water.globalAlpha = originGlow * .56 * wave.strength;

      arc(x - 1.1, y - .6, radius * .967, height * .96, tilt,
        3.11 + drift, 3.52 + drift, '#f4fbff', 1.2, .67 * light);
    }
  }

  function render(now) {
    frame = 0;
    water.clearRect(0, 0, view.width, view.height);
    for (let i = waves.length - 1; i >= 0; i--) {
      if (now - waves[i].start >= waves[i].duration + waves[i].rings * 40) {

    if (waves.length >= 6) waves.shift();
    waves.push({
      x, y,
      start: performance.now(),
      duration: ambient ? 2300 : 1800,
      strength: (ambient ? .75 : .96) * scale,
      span: span * (ambient ? .90 + Math.random() * .2 : 1),
      rings: ambient ? 3 : 4,
      tilt: (x / view.width - .5) * .17,
    });

  }

  function ambient() {
    if (!active()) return;
    const scene = stage?.dataset.page === 'inner' ? 'inner' : stage?.dataset.state;
    const points = locations[scene] || locations.intro;
    const [x, y] = points[locationIndex % points.length];
    const jitter = Math.random() * .03 - .015;
    ripple((x + jitter) * view.width, (y + jitter) * view.height, 'ambient');
    locationIndex++;

  }

  function handleTap(event) {
    const element = event.target instanceof Element ? event.target : null;
    const control = element?.closest('button, a, [role="button"]');
    if (event.detail) {

      bounds.top - view.top + bounds.height / 2, 'tap');

      fitSurface();
      ambientTimer = window.setTimeout(ambient, 1450);

    frame = 0;
    waves.length = 0;
    water.clearRect(0, 0, view.width, view.height);
  }

  document.addEventListener('click', handleTap, { capture: true, passive: true });
  document.addEventListener('visibilitychange', updateMotion);
  motion.addEventListener('change', updateMotion);
  updateMotion();
})();

(() => {
  const canvas = document.querySelector('canvas.directory-current');
  const map = canvas?.closest('.flow-map');
  const ink = canvas?.getContext('2d');
  if (!map || !ink) return;

  const stage = map.closest('.stage');
  const innerPage = map.closest('.inner-page');
  const panel = map.closest('[data-panel]');
  const glyphs = [...map.querySelectorAll('.flow-glyph[data-glyph]')];
  const entries = [...map.querySelectorAll('.directory-link')].map(link => ({
    icon: link.querySelector('.flow-icon'),
    label: link.querySelector('.flow-label'),
  })).filter(({ icon, label }) => icon && label);
  const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const period = 1000 / 30;
  let geometry;
  let needsMeasure = true;
  let intersectsView = true;
  let frame = 0;
  let lastPaint = -Infinity;

  function visible() {
    return intersectsView && !document.hidden && !innerPage?.hidden && !panel?.hidden
      && (stage?.dataset.page === 'opening' || stage?.dataset.page === 'inner')
      && (!innerPage?.dataset.view || innerPage.dataset.view === 'directory');
  }

  function edge(box, target, gap) {
    const dx = target.x - box.x;
    const dy = target.y - box.y;
    const step = Math.min((box.width / 2 + gap) / Math.abs(dx),
      (box.height / 2 + gap) / Math.abs(dy), .45);
    return { x: box.x + dx * step, y: box.y + dy * step };
  }

  function current(from, to, index, isTitle) {
    const start = edge(from, to, isTitle ? 2 : 4);
    const end = edge(to, from, isTitle ? 2 : 5);
    const vx = end.x - start.x;
    const vy = end.y - start.y;
    const length = Math.hypot(vx, vy) || 1;
    const dye = ink.createLinearGradient(start.x, start.y, end.x, end.y);
    dye.addColorStop(0, 'rgba(49, 94, 133, .28)');
    dye.addColorStop(.19, 'rgba(39, 97, 140, .71)');
    dye.addColorStop(.49, 'rgba(65, 123, 163, .70)');
    dye.addColorStop(.82, 'rgba(35, 93, 138, .66)');
    dye.addColorStop(1, 'rgba(44, 102, 141, .31)');
    return {
      start, vx, vy, length, dye, isTitle,
      nx: -vy / length, ny: vx / length,
      bend: Math.min(isTitle ? 17 : 38, length * (isTitle ? .40 : .25)),
      phase: index * 1.81 + (isTitle ? .4 : 1.2),
      direction: index % 2 === 0 ? 1 : -1,
      steps: Math.max(14, Math.min(48, Math.round(length / 4))),
    };
  }

  function measure() {
    const bounds = canvas.getBoundingClientRect();
    if (bounds.width < 1 || bounds.height < 1) return;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const width = Math.max(1, Math.round(bounds.width * dpr));
    const height = Math.max(1, Math.round(bounds.height * dpr));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    ink.setTransform(width / bounds.width, 0, 0, height / bounds.height, 0, 0);
    ink.lineCap = 'round';
    ink.lineJoin = 'round';

    function localRect(rect) {
      const left = rect.left - bounds.left;
      const top = rect.top - bounds.top;
      return {
        left, top, width: rect.width, height: rect.height,
        x: left + rect.width / 2, y: top + rect.height / 2,
      };
    }

    const letters = glyphs.map(glyph => localRect(glyph.getBoundingClientRect()));
    const anchors = entries.map(({ icon, label }) => {
      // Aim at the drawn mark inside the larger touch target.
      const { x, y } = localRect(icon.getBoundingClientRect());
      const mark = { x, y, left: x - 8, top: y - 8, width: 16, height: 16 };
      const range = document.createRange();
      range.selectNodeContents(label);
      return { icon: mark, labels: [...range.getClientRects()].map(localRect) };
    });
    const lines = letters.slice(1).map((letter, index) => (
      current(letters[index], letter, index, true)
    ));
    const usage = new Array(letters.length).fill(0);
    const spacing = Math.min(44, bounds.width * .095);
    for (const [index, { icon }] of anchors.entries()) {
      let nearest = -1;
      let minimum = Infinity;
      for (const [position, letter] of letters.entries()) {
        const distance = Math.hypot(icon.x - letter.x, icon.y - letter.y) + usage[position] * spacing;
        if (distance < minimum) {
          nearest = position;
          minimum = distance;
        }
      }
      if (nearest < 0) continue;
      usage[nearest]++;
      lines.push(current(letters[nearest], icon, index, false));

      width: bounds.width, height: bounds.height, lines,
      occlusions: [...letters, ...anchors.flatMap(({ icon, labels }) => [icon, ...labels])],

    const bell = Math.sin(amount * Math.PI);
    const direction = line.direction;
    const fold = line.isTitle ? 1 - 1.7 * amount : 1 - 2.35 * amount;
    const drift = .26 * Math.sin(5.4 * amount - seconds * 1.15 + line.phase)
      + .12 * Math.sin(10.1 * amount + seconds * .65 + line.phase * .5);
    const roll = fringe * bell * (.6 + .4 * Math.sin(amount * 5 + line.phase));
    const offset = bell * line.bend * (.82 * direction * fold + drift) + roll;
    return [
      line.start.x + line.vx * amount + line.nx * offset,
      line.start.y + line.vy * amount + line.ny * offset,
    ];

  function trace(line, seconds, start = 0, end = 1, fringe = 0) {
    const samples = Math.max(5, Math.ceil((end - start) * line.steps));
    const [x, y] = sketch(line, start, seconds, fringe);
    ink.beginPath();
    ink.moveTo(x, y);
    for (let index = 1; index <= samples; index++) {
      const step = start + (end - start) * index / samples;
      ink.lineTo(...sketch(line, step, seconds, fringe));
    }

    trace(line, seconds);
    ink.strokeStyle = 'rgba(236, 248, 253, .57)';
    ink.lineWidth = line.isTitle ? 2.35 : 2.9;
    ink.stroke();
    ink.strokeStyle = line.dye;
    ink.lineWidth = line.isTitle ? 1.06 : 1.12;
    ink.stroke();

    if (!line.isTitle && line.length > 56) {
      trace(line, seconds, .16, .83, 3.7 * line.direction);
      ink.strokeStyle = 'rgba(79, 137, 173, .29)';
      ink.lineWidth = .6;
      ink.stroke();
    }

    const cycle = seconds / (line.isTitle ? 3.7 : 6.8) + line.phase * .26;
    const center = (cycle - Math.floor(cycle)) * 1.34 - .17;
    const trail = line.isTitle ? .20 : .16;

    const end = Math.min(1, center + trail);
    if (end - start < .035) return;

    const [ex, ey] = sketch(line, end, seconds);
    const shine = ink.createLinearGradient(sx, sy, ex, ey);
    shine.addColorStop(0, 'rgba(188, 231, 249, 0)');
    shine.addColorStop(.32, 'rgba(164, 222, 249, .52)');
    shine.addColorStop(.62, 'rgba(241, 253, 255, .98)');
    shine.addColorStop(.82, 'rgba(171, 228, 249, .76)');
    shine.addColorStop(1, 'rgba(196, 231, 244, 0)');
    trace(line, seconds, start, end);
    ink.strokeStyle = shine;
    ink.lineWidth = line.isTitle ? 2.15 : 2.35;
    ink.stroke();
  }

  function draw(seconds) {
    if (!geometry) return;
    const { width, height, lines, occlusions } = geometry;
    ink.clearRect(0, 0, width, height);
    for (const line of lines) paintLine(line, seconds);

    // Keep the title, labels and icons clear when a current bends nearby.
    ink.globalCompositeOperation = 'destination-out';
    for (const { left, top, width, height } of occlusions) {
      ink.fillRect(left - 1, top - 1, width + 2, height + 2);
    }
    ink.globalCompositeOperation = 'source-over';
  }

  function tick(now) {
    frame = 0;
    if (!visible()) return;
    const staticInk = motion.matches;
    if (needsMeasure) measure();
    if (staticInk || now - lastPaint >= period - 2) {
      draw(staticInk ? 0 : now / 1000);
      lastPaint = now;
    }
    if (!staticInk) frame = requestAnimationFrame(tick);
  }

  function sync() {
    if (visible()) {
      if (!frame) frame = requestAnimationFrame(tick);
    } else if (frame) {
      cancelAnimationFrame(frame);
      frame = 0;
    }
  }

  function invalidate() {
    needsMeasure = true;
    sync();
  }

  const state = new MutationObserver(invalidate);
  if (stage) state.observe(stage, { attributes: true, attributeFilter: ['data-page'] });
  if (innerPage) state.observe(innerPage, { attributes: true, attributeFilter: ['data-view', 'hidden'] });
  if (panel) state.observe(panel, { attributes: true, attributeFilter: ['hidden'] });
  if ('ResizeObserver' in window) {
    const size = new ResizeObserver(invalidate);
    size.observe(map);
    for (const glyph of glyphs) size.observe(glyph);
    for (const { icon, label } of entries) {
      size.observe(icon);
      size.observe(label);
    }
  }
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(([entry]) => {
      intersectsView = entry.isIntersecting;
      sync();
    }).observe(map);
  }
  window.addEventListener('resize', invalidate, { passive: true });
  document.addEventListener('visibilitychange', sync);
  motion.addEventListener('change', sync);
  document.fonts?.ready.then(invalidate);
  sync();
})();
